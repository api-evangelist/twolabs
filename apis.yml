aid: twolabs
name: Twolabs
description: 'Twolabs is a San Francisco robotics startup (Y Combinator, Spring 2026)
  building Tobi, a modular humanoid robot platform for builders to collect data,
  train skills, and deploy autonomous robots. The two-founder company vertically
  integrates hardware and AI in-house, streamlining robot training into a Record,
  Upload, Train, Deploy workflow, and is initially focused on caregiving applications
  in senior-care facilities such as feeding, dressing, medication reminders, mobility
  support, and companionship. This API Evangelist profile tracks the company; it
  does not yet publish a public developer API, documentation, or SDKs.'
